<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
<title id="title">BLUE TEAMING</title><desc id="desc">Detection, investigation, and defensive improvement. Technologies: Wazuh · Suricata · Wireshark · Linux Logs.</desc>
