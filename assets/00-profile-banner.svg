<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">Jessica Edward | Cybersecurity Analyst</title>
<desc id="desc">Animated cybersecurity profile banner with prominent name, network nodes, shield, and a terminal running a scan command.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050914"/><stop offset=".55" stop-color="#160d35"/><stop offset="1" stop-color="#071923"/></linearGradient>
 <linearGradient id="neon"><stop stop-color="#67e8f9"/><stop offset=".55" stop-color="#a78bfa"/><stop offset="1" stop-color="#e879f9"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
 .name{font:800 52px 'Segoe UI',Arial,sans-serif;letter-spacing:1.5px;fill:#fff}
 .role{font:700 22px 'Segoe UI',Arial,sans-serif;letter-spacing:3px;fill:#67e8f9}
 .tag{font:600 13px 'Segoe UI',Arial,sans-serif;letter-spacing:1.3px;fill:#d8ccff}
 .term{font:600 14px Consolas,monospace;fill:#b8f7ff}
 .muted{font:12px Consolas,monospace;fill:#a78bfa}
 @keyframes scanline{0%{transform:translateY(0)}100%{transform:translateY(105px)}}
 @keyframes blink{0%,48%{opacity:1}50%,100%{opacity:0}}
 @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}\n @keyframes borderPulse{0%,100%{stroke-opacity:.75}50%{stroke-opacity:1}}
 .scan{animation:scanline 3.2s linear infinite}
 .cursor{animation:blink 1s steps(1) infinite}
 .pulse{animation:pulse 2s ease-in-out infinite}
 </style>
</defs>
<rect width="1200" height="320" rx="24" fill="url(#bg)" stroke="#7c3aed" stroke-width="2.5"/>
<g fill="none" stroke="url(#neon)" opacity=".55">
 <path d="M0 55H110L145 90H190 M0 260H90L125 225H180 M1200 48H1140L1110 78H1080 M1200 285H1120L1085 250H1060" stroke-width="2"/>
 <path d="M25 105H95 M25 112H70 M1100 105H1170 M1125 112H1170" stroke-width="1"/>
</g>
<!-- network nodes -->
<g stroke="#67e8f9" stroke-width="1.5" fill="#67e8f9" opacity=".8">
 <path d="M72 150L112 130L145 158L112 187L72 150M112 130V187M72 150H145" fill="none"/>
 <circle cx="72" cy="150" r="4"/><circle cx="112" cy="130" r="4"/><circle cx="145" cy="158" r="4"/><circle cx="112" cy="187" r="4"/>
 <path d="M1090 140L1125 120L1160 145L1125 170Z" fill="none"/><circle cx="1090" cy="140" r="4"/><circle cx="1125" cy="120" r="4"/><circle cx="1160" cy="145" r="4"/><circle cx="1125" cy="170" r="4"/>
</g>
<!-- subtle circuit traces and security lock accent -->
<g transform="translate(72 215)" fill="none" stroke="#67e8f9" stroke-width="1.5" opacity=".6">
 <path d="M0 0H48L60 12H92 M0 8H34L44 18H72"/>
 <circle cx="94" cy="12" r="3" fill="#67e8f9" class="pulse"/>
</g>
<!-- shield icon -->
<g transform="translate(205 67)" filter="url(#glow)" stroke="#a78bfa" stroke-width="2.5" fill="none">
 <path d="M0 0L22 8V27C22 43 10 53 0 58C-10 53-22 43-22 27V8Z"/><path d="M-10 28L-2 36L12 19" stroke="#67e8f9"/>
</g>
<text x="250" y="102" class="name" filter="url(#glow)">JESSICA EDWARD</text>
<rect x="248" y="119" width="480" height="3" rx="1" fill="url(#neon)"/>
<text x="250" y="154" class="role">CYBERSECURITY ANALYST</text>
<text x="250" y="185" class="tag">RED TEAMING  •  BLUE TEAMING  •  NETWORK SECURITY</text>
<text x="250" y="215" class="tag">Investigate with curiosity. Validate with evidence. Defend with purpose.</text>
<!-- animated terminal -->
<g transform="translate(785 65)">
 <rect width="360" height="174" rx="12" fill="#080d1b" stroke="#67e8f9" stroke-width="1.5" opacity=".98"/>
 <path d="M0 35H360" stroke="#34456b" stroke-width="1"/>
 <circle cx="18" cy="18" r="4" fill="#fb7185"/><circle cx="32" cy="18" r="4" fill="#fbbf24"/><circle cx="46" cy="18" r="4" fill="#34d399"/>
 <text x="62" y="22" class="muted">SECURITY TERMINAL</text>
 <text x="18" y="59" class="term">$ ./scan --target lab-network</text>
 <text x="18" y="84" class="term">[+] Initialising scan...</text>
 <text x="18" y="107" class="term">[+] Checking exposed services</text>
 <text x="18" y="130" class="term">[+] Analysing network traffic</text>
 <text x="18" y="153" class="term">[OK] Scan complete <tspan fill="#34d399">✓</tspan></text>
 <rect x="12" y="40" width="336" height="3" fill="#67e8f9" opacity=".5" class="scan"/>
 <text x="18" y="166" class="term cursor">▌</text>
</g>
<text x="785" y="267" class="muted">STATUS: <tspan fill="#34d399">● ACTIVE</tspan>  /  LAB ENVIRONMENT</text>
<path d="M248 245H735" stroke="#8b5cf6" stroke-width="1" opacity=".5"/>
<text x="250" y="273" class="muted">SECURITY • DETECTION • RESPONSE • CONTINUOUS LEARNING</text>
</svg>