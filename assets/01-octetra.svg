<style>.title{font:700 30px 'Segoe UI',Arial,sans-serif;fill:#f5efff}.subtitle{font:italic 17px 'Segoe UI',Arial,sans-serif;fill:#67e8f9}.meta{font:600 15px 'Segoe UI',Arial,sans-serif;fill:#67e8f9}.body{font:17px 'Segoe UI',Arial,sans-serif;fill:#f5efff}@keyframes cardPulse{0%,100%{stroke-opacity:.72}50%{stroke-opacity:1}} .frame{animation:cardPulse 4s ease-in-out infinite}.pill{animation:cardPulse 3.5s ease-in-out infinite}.tag{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#c4b5fd}</style>
