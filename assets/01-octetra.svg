<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
<title id="title">OCTETRA — Inside the Packet</title><desc id="desc">A Python desktop tool for network packet visibility. Technologies: Python · Scapy · CustomTkinter · SQLite · Pandas · Matplotlib.</desc>
